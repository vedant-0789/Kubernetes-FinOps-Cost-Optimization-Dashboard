apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finops.fullname" . }}-config
  labels: {{- include "finops.labels" . | nindent 4 }}
data:
  FINOPS_ENVIRONMENT: prod
  FINOPS_AUTO_MIGRATE: "false"
  FINOPS_RUN_SCHEDULER_IN_API: "false"
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finops.secretName" . }}
  labels: {{- include "finops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.bundled.enabled }}
  FINOPS_DATABASE_URL: {{ printf "postgresql+psycopg://finops:%s@%s:5432/finops" .Values.database.bundled.password (include "finops.dbHost" .) | quote }}
  {{- else }}
  FINOPS_DATABASE_URL: {{ required "secrets.databaseUrl is required when database.bundled.enabled=false" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- with .Values.secrets.adminApiKey }}
  FINOPS_ADMIN_API_KEY: {{ . | quote }}
  {{- end }}
  {{- /* Keep an existing generated secret on upgrade so sessions survive. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "finops.secretName" .) }}
  {{- $jwt := .Values.secrets.jwtSecret | default (and $existing (index $existing.data "FINOPS_JWT_SECRET") | default "" | b64dec) | default (randAlphaNum 48) }}
  FINOPS_JWT_SECRET: {{ $jwt | quote }}
  {{- with .Values.secrets.bootstrapAdmin }}
  {{- if and .email .password }}
  FINOPS_BOOTSTRAP_ADMIN_EMAIL: {{ .email | quote }}
  FINOPS_BOOTSTRAP_ADMIN_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
