apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finops.fullname" . }}-worker
  labels: {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate   # never two workers running jobs at once
  selector:
    matchLabels: {{- include "finops.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "finops.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- include "finops.pod" . | nindent 6 }}
      initContainers:
        - name: wait-for-schema
          image: {{ include "finops.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "until alembic upgrade head; do echo 'waiting for database'; sleep 3; done"]
          {{- include "finops.env" . | nindent 10 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      containers:
        - name: worker
          image: {{ include "finops.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          {{- include "finops.env" . | nindent 10 }}
          ports:
            - { name: metrics, containerPort: 9100 }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finops.fullname" . }}-ui
  labels: {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: {{- include "finops.selector" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "finops.selector" (dict "root" . "component" "ui") | nindent 8 }}
    spec:
      {{- include "finops.pod" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "finops.uiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FINOPS_API_UPSTREAM
              value: http://{{ include "finops.fullname" . }}-api:8000
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finops.fullname" . }}-ui
  labels: {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: 80, targetPort: http }
  selector: {{- include "finops.selector" (dict "root" . "component" "ui") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finops.fullname" . }}-worker
  labels: {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  ports:
    - { name: metrics, port: 9100, targetPort: metrics }
  selector: {{- include "finops.selector" (dict "root" . "component" "worker") | nindent 4 }}
