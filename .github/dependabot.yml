# Weekly dependency updates, grouped so each ecosystem opens at most one PR a week.
# Every PR runs the full CI (required checks on main) before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directories: [/backend, /agent, /research]
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /agent, /frontend]
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ["*"] }
